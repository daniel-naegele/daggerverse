name: Publish Codemagic CLI Tools Image

on:
  push:
    branches:
      - main
    paths:
      - codemagic-cli-tools/**
      - .github/workflows/codemagic-cli-tools-publish.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish codemagic-cli-tools image
        uses: dagger/dagger-for-github@v8.4.0
        with:
          workdir: codemagic-cli-tools
          version: "0.21.7"
          call: >-
            publish
            --registry=${{ vars.REGISTRY }}
            --username=${{ vars.REGISTRY_USERNAME }}
            --password=env:REGISTRY_PASSWORD
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
        env:
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
